[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wraith-terminal"
version = "0.1.0"
description = "A haunted terminal companion powered by local AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "requests>=2.31", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wraith = "wraith.cli:app"

[tool.setuptools.packages.find]
include = ["wraith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
